<div class="row">
  <span class="muted">{{ page_obj.paginator.count }} results · Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div style="text-align:right">
    {% if page_obj.has_previous %}<a class="btn ghost" href="?{{ filter_query }}&amp;page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn ghost" href="?{{ filter_query }}&amp;page={{ page_obj.next_page_number }}">Next</a>{% endif %}
  </div>
</div>
