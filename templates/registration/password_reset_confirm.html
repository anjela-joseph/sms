{% extends "base.html" %}{% block content %}<div class="card narrow"><h1>Choose a new password</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn">Set password</button></form>
{% else %}<p>This reset link is invalid or has expired. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>{% endif %}</div>{% endblock %}
