{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<style>
.auth-page{min-height:100vh;background:#f6f9fc;display:flex;flex-direction:column;align-items:center;padding:56px 16px}
.auth-page .wordmark{font-size:34px;margin-bottom:32px}
.auth-box{width:100%;max-width:440px;background:#fff;border-radius:8px;box-shadow:0 15px 35px rgba(60,66,87,.08),0 5px 15px rgba(0,0,0,.06);padding:40px 44px}
.auth-box h1{font-size:22px;font-weight:600;letter-spacing:-.2px;margin:0 0 24px}
.auth-box .btn{width:100%;height:38px;margin-top:6px}
.auth-foot{margin-top:24px;color:var(--muted);font-size:14px;text-align:center}
.rules{list-style:none;padding:0;margin:-4px 0 14px;font-size:13px}
.rules li{color:var(--muted)}.rules li::before{content:"○ ";font-size:11px}
.rules li.ok{color:var(--ok)}.rules li.ok::before{content:"✓ "}
@media(max-width:500px){.auth-box{padding:28px 22px}}
</style>
<div class="auth-page">
  <a class="wordmark" href="{% url 'home' %}">brightloop</a>
  <div class="auth-box">
    <h1>Log in to your account</h1>
    {% if form.errors %}<div class="msg error">The email or password is incorrect.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <p><label for="id_username">Email</label>
        <input type="email" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autofocus required></p>
      <p><label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required></p>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn">Log in</button>
    </form>
    <p class="muted" style="margin:16px 0 0;text-align:center"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
  </div>
  <p class="auth-foot">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
